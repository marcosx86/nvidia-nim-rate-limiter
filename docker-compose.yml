name: nvidia-nim-ratelimit
services:
  fastapi-proxy:
    build: .
    container_name: nvidia-nim-ratelimit

    environment:
      NVIDIA_API_KEY: ${NVIDIA_API_KEY}
      RPM: ${RPM:-10.0}
      WINDOW_SECONDS: ${WINDOW_SECONDS:-60.0}
      BURST_CAPACITY: ${BURST_CAPACITY:-10.0}
      TPM: ${TPM:-0}
      MAX_WAIT_SECONDS: ${MAX_WAIT_SECONDS:-0.0}
      DAILY_REQUEST_CAP: ${DAILY_REQUEST_CAP:-0}
      DAILY_TOKEN_CAP: ${DAILY_TOKEN_CAP:-0}
      MAX_CONCURRENT: ${MAX_CONCURRENT:-2}
      UPSTREAM_URL: ${UPSTREAM_URL:-https://integrate.api.nvidia.com}
      DEPLOYMENT_MODE: ${DEPLOYMENT_MODE:-auto}
      CATALOG_CACHE_TTL: ${CATALOG_CACHE_TTL:-300.0}
      ENFORCE_CATALOG: ${ENFORCE_CATALOG:-false}
      DB_PATH: ${DB_PATH:-data/limiter.db}
      DB_URL: ${DB_URL:-}
      DB_POOL_MIN: ${DB_POOL_MIN:-1}
      DB_POOL_MAX: ${DB_POOL_MAX:-5}
      DB_CONNECT_TIMEOUT: ${DB_CONNECT_TIMEOUT:-10.0}
      CONFIG_FILE: ${CONFIG_FILE:-data/config.yaml}
      ENV_FILE: ${ENV_FILE:-.env}
      ADMIN_TITLE: ${ADMIN_TITLE:-NVIDIA NIM Rate Limiter Dashboard}
      WWWROOT_DIR: ${WWWROOT_DIR:-wwwroot}

    restart: unless-stopped

    ports:
      - 8199:8000

    volumes:
      - data:/app/data

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  postgres:
    image: postgres:16-alpine
    profiles: ["postgres"]
    container_name: nvidia-nim-ratelimit-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ratelimiter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ratelimiter}
      POSTGRES_DB: ${POSTGRES_DB:-ratelimiter}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ratelimiter}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  data:
  pgdata:

