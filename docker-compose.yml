services:
  nvidia-nim-ratelimit:
    build: .
    container_name: nvidia-nim-ratelimit

    environment:
      NVIDIA_API_KEY: ${NVIDIA_API_KEY}
      RPM: ${RPM:-10.0}
      WINDOW_SECONDS: ${WINDOW_SECONDS:-60.0}
      BURST_CAPACITY: ${BURST_CAPACITY:-10.0}
      MAX_CONCURRENT: ${MAX_CONCURRENT:-2}
      UPSTREAM_URL: ${UPSTREAM_URL:-https://integrate.api.nvidia.com}
      DB_PATH: ${DB_PATH:-data/limiter.db}
      CONFIG_FILE: ${CONFIG_FILE:-data/config.yaml}

    restart: unless-stopped

    ports:
      - "127.0.0.1:8199:8000"

    volumes:
      - data:/app/data

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  data:

