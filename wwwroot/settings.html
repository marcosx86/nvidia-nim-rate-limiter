<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ ADMIN_TITLE }} — Settings</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0d1117;
            --card-bg: #161b22;
            --border: #30363d;
            --text: #c9d1d9;
            --text-muted: #8b949e;
            --accent: #76b900;
            --accent-hover: #5c9300;
            --danger: #f85149;
            --warning: #d29922;
            --blue: #58a6ff;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            padding: 24px;
            line-height: 1.5;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 14px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 24px;
        }
        .header h1 {
            font-size: 1.5rem;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .nav-links {
            display: inline-flex;
            gap: 6px;
            background: rgba(0, 0, 0, 0.25);
            padding: 4px;
            border-radius: 8px;
            border: 1px solid var(--border);
        }
        .nav-link {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.84rem;
            font-weight: 500;
            padding: 5px 12px;
            border-radius: 6px;
            transition: all 0.15s ease;
        }
        .nav-link:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.06);
        }
        .nav-link.active {
            background: rgba(118, 185, 0, 0.18);
            color: var(--accent);
            font-weight: 600;
        }
        .runtime-strip {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px 18px;
            margin-bottom: 20px;
            font-size: 0.84rem;
        }
        .runtime-item strong { color: #fff; }
        .runtime-item code {
            background: rgba(255, 255, 255, 0.06);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.8rem;
            color: var(--blue);
        }
        .settings-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(380px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        .section {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 20px;
        }
        .section-title {
            font-size: 1.05rem;
            font-weight: 600;
            color: #fff;
            margin-bottom: 16px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border);
        }
        .form-group {
            margin-bottom: 14px;
        }
        .form-group label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.84rem;
            color: var(--text);
            margin-bottom: 6px;
            font-weight: 500;
        }
        .opt-tag {
            font-size: 0.72rem;
            color: var(--text-muted);
            font-weight: 400;
        }
        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 8px 12px;
            background-color: var(--bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: #fff;
            font-size: 0.88rem;
            font-family: inherit;
        }
        .form-group textarea {
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: 0.82rem;
            min-height: 76px;
            resize: vertical;
        }
        .form-group input:disabled,
        .form-group select:disabled,
        .form-group textarea:disabled {
            background-color: rgba(210, 153, 34, 0.06);
            border-color: rgba(210, 153, 34, 0.35);
            color: var(--text-muted);
            cursor: not-allowed;
        }
        .checkbox-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .checkbox-row input[type="checkbox"] {
            width: auto;
            accent-color: var(--accent);
        }
        .lock-warn {
            margin-top: 5px;
            font-size: 0.76rem;
            color: #f0c45c;
            background: rgba(210, 153, 34, 0.12);
            border: 1px solid rgba(210, 153, 34, 0.35);
            border-radius: 5px;
            padding: 4px 8px;
        }
        .field-hint {
            margin-top: 4px;
            font-size: 0.75rem;
            color: var(--text-muted);
        }
        .actions-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 14px;
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 16px 20px;
        }
        .btn {
            background-color: var(--accent);
            color: #000;
            font-weight: 600;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: background-color 0.2s;
        }
        .btn:hover { background-color: var(--accent-hover); }
        .status-msg {
            font-size: 0.86rem;
        }
        .status-ok { color: #3fb950; }
        .status-err { color: var(--danger); }
        .status-warn { color: #f0c45c; }
    </style>
</head>
<body>

    <div class="header">
        <h1>
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
            <span id="headerTitle">{{ ADMIN_TITLE }}</span>
        </h1>
        <div class="header-actions">
            <nav class="nav-links" aria-label="Admin Navigation">
                <a class="nav-link" href="/admin/">Dashboard</a>
                <a class="nav-link active" href="/admin/settings">Settings</a>
            </nav>
        </div>
    </div>

    <div class="runtime-strip" id="runtimeStrip">
        <div class="runtime-item"><strong>NVIDIA_API_KEY:</strong> <code id="rtApiKeySource">-</code></div>
        <div class="runtime-item"><strong>DB Backend:</strong> <code id="rtDbBackend">-</code></div>
        <div class="runtime-item"><strong>DB Target:</strong> <code id="rtDbTarget">-</code></div>
        <div class="runtime-item"><strong>Bind:</strong> <code id="rtBind">-</code></div>
    </div>

    <form id="settingsForm" onsubmit="saveSettings(event)">
        <div class="settings-grid">
            <!-- Section 1: Admin -->
            <div class="section">
                <div class="section-title">Admin Dashboard</div>
                <div class="form-group">
                    <label for="cfgTitle">Dashboard Title</label>
                    <input type="text" id="cfgTitle" data-path="admin.title" required>
                    <div class="lock-slot" data-lock-for="admin.title"></div>
                </div>
            </div>

            <!-- Section 2: Rate Limiting & Quotas -->
            <div class="section">
                <div class="section-title">Rate Limiting &amp; Quotas</div>
                <div class="form-group">
                    <label for="cfgRpm">Requests Per Minute (RPM)</label>
                    <input type="number" step="0.1" min="0.1" id="cfgRpm" data-path="rate_limit.requests_per_minute" required>
                    <div class="lock-slot" data-lock-for="rate_limit.requests_per_minute"></div>
                </div>
                <div class="form-group">
                    <label for="cfgWindow">Window Seconds</label>
                    <input type="number" step="0.1" min="0.1" id="cfgWindow" data-path="rate_limit.window_seconds" required>
                    <div class="lock-slot" data-lock-for="rate_limit.window_seconds"></div>
                </div>
                <div class="form-group">
                    <label for="cfgBurst">Burst Capacity</label>
                    <input type="number" step="0.1" min="0.1" id="cfgBurst" data-path="rate_limit.burst_capacity" required>
                    <div class="lock-slot" data-lock-for="rate_limit.burst_capacity"></div>
                </div>
                <div class="form-group">
                    <label for="cfgTpm">Tokens Per Minute (TPM) <span class="opt-tag">optional</span></label>
                    <input type="number" step="1" min="0" id="cfgTpm" data-path="rate_limit.tokens_per_minute" placeholder="Empty = disabled (0)">
                    <div class="lock-slot" data-lock-for="rate_limit.tokens_per_minute"></div>
                </div>
                <div class="form-group">
                    <label for="cfgMaxWait">Max Wait Seconds <span class="opt-tag">optional</span></label>
                    <input type="number" step="0.1" min="0" id="cfgMaxWait" data-path="rate_limit.max_wait_seconds" placeholder="Empty = wait indefinitely (0)">
                    <div class="lock-slot" data-lock-for="rate_limit.max_wait_seconds"></div>
                </div>
                <div class="form-group">
                    <label for="cfgDailyReq">Daily Request Cap (UTC) <span class="opt-tag">optional</span></label>
                    <input type="number" step="1" min="0" id="cfgDailyReq" data-path="rate_limit.daily_request_cap" placeholder="Empty = unlimited (0)">
                    <div class="lock-slot" data-lock-for="rate_limit.daily_request_cap"></div>
                </div>
                <div class="form-group">
                    <label for="cfgDailyTok">Daily Token Cap (UTC) <span class="opt-tag">optional</span></label>
                    <input type="number" step="1" min="0" id="cfgDailyTok" data-path="rate_limit.daily_token_cap" placeholder="Empty = unlimited (0)">
                    <div class="lock-slot" data-lock-for="rate_limit.daily_token_cap"></div>
                </div>
                <div class="form-group">
                    <label for="cfgModelLimits">Per-Model Rate Limits (JSON) <span class="opt-tag">optional</span></label>
                    <textarea id="cfgModelLimits" data-path="rate_limit.models" placeholder='Empty = none, e.g. {"deepseek-ai/deepseek-r1": {"requests_per_minute": 5}}'></textarea>
                    <div class="lock-slot" data-lock-for="rate_limit.models"></div>
                </div>
            </div>

            <!-- Section 3: Proxy, Governance & Routing -->
            <div class="section">
                <div class="section-title">Proxy, Governance &amp; Routing</div>
                <div class="form-group">
                    <label for="cfgUpstream">Upstream URL</label>
                    <input type="text" id="cfgUpstream" data-path="proxy.upstream_url" required>
                    <div class="lock-slot" data-lock-for="proxy.upstream_url"></div>
                </div>
                <div class="form-group">
                    <label for="cfgConcurrency">Concurrency Limit</label>
                    <input type="number" step="1" min="1" id="cfgConcurrency" data-path="proxy.concurrency_limit" required>
                    <div class="lock-slot" data-lock-for="proxy.concurrency_limit"></div>
                </div>
                <div class="form-group">
                    <label for="cfgDeploymentMode">Deployment Mode</label>
                    <select id="cfgDeploymentMode" data-path="proxy.deployment_mode">
                        <option value="auto">auto</option>
                        <option value="trial">trial</option>
                        <option value="self_hosted">self_hosted</option>
                        <option value="partner">partner</option>
                    </select>
                    <div class="lock-slot" data-lock-for="proxy.deployment_mode"></div>
                </div>
                <div class="form-group">
                    <label for="cfgCatalogTtl">Catalog Cache TTL (Seconds) <span class="opt-tag">optional</span></label>
                    <input type="number" step="1" min="0" id="cfgCatalogTtl" data-path="proxy.catalog_cache_ttl" placeholder="Empty = default (300)">
                    <div class="lock-slot" data-lock-for="proxy.catalog_cache_ttl"></div>
                </div>
                <div class="form-group">
                    <div class="checkbox-row">
                        <input type="checkbox" id="cfgEnforceCatalog" data-path="proxy.enforce_catalog">
                        <label for="cfgEnforceCatalog" style="margin-bottom: 0;">Enforce Cached /v1/models Catalog (404 on unknown)</label>
                    </div>
                    <div class="lock-slot" data-lock-for="proxy.enforce_catalog"></div>
                </div>
                <div class="form-group">
                    <label for="cfgAllowedModels">Allowed Models (one per line or comma-separated) <span class="opt-tag">optional</span></label>
                    <textarea id="cfgAllowedModels" data-path="proxy.allowed_models" placeholder="Empty = allow all models"></textarea>
                    <div class="lock-slot" data-lock-for="proxy.allowed_models"></div>
                </div>
                <div class="form-group">
                    <label for="cfgBlockedModels">Blocked Models (one per line or comma-separated) <span class="opt-tag">optional</span></label>
                    <textarea id="cfgBlockedModels" data-path="proxy.blocked_models" placeholder="Empty = none blocked"></textarea>
                    <div class="lock-slot" data-lock-for="proxy.blocked_models"></div>
                </div>
                <div class="form-group">
                    <label for="cfgModelRoutes">Per-Model Upstream Routes (JSON, no raw secrets) <span class="opt-tag">optional</span></label>
                    <textarea id="cfgModelRoutes" data-path="proxy.model_routes" placeholder='Empty = use default upstream, e.g. {"meta/llama-3.3-70b-instruct": {"upstream_url": "http://nim-local:8000"}}'></textarea>
                    <div class="lock-slot" data-lock-for="proxy.model_routes"></div>
                </div>
            </div>

            <!-- Section 4: Database -->
            <div class="section">
                <div class="section-title">Database Storage</div>
                <div class="form-group">
                    <label for="cfgDbPath">SQLite Database Path</label>
                    <input type="text" id="cfgDbPath" data-path="db.path" required>
                    <div class="lock-slot" data-lock-for="db.path"></div>
                </div>
                <div class="form-group">
                    <label for="cfgDbUrlEnv">DB URL Env Var Name (db.url_env) <span class="opt-tag">optional</span></label>
                    <input type="text" id="cfgDbUrlEnv" data-path="db.url_env" placeholder="Empty = unset (uses SQLite path above)">
                    <div class="field-hint">Reference an env var name (e.g., DATABASE_URL); raw DSN passwords are never stored in config.yaml.</div>
                    <div class="lock-slot" data-lock-for="db.url_env"></div>
                </div>
                <div class="form-group">
                    <label for="cfgDbPoolMin">PostgreSQL Pool Min <span class="opt-tag">optional</span></label>
                    <input type="number" step="1" min="1" id="cfgDbPoolMin" data-path="db.pool_min" placeholder="Empty = default (1)">
                    <div class="lock-slot" data-lock-for="db.pool_min"></div>
                </div>
                <div class="form-group">
                    <label for="cfgDbPoolMax">PostgreSQL Pool Max <span class="opt-tag">optional</span></label>
                    <input type="number" step="1" min="1" id="cfgDbPoolMax" data-path="db.pool_max" placeholder="Empty = default (5)">
                    <div class="lock-slot" data-lock-for="db.pool_max"></div>
                </div>
                <div class="form-group">
                    <label for="cfgDbTimeout">DB Connect Timeout (Seconds) <span class="opt-tag">optional</span></label>
                    <input type="number" step="0.1" min="0.1" id="cfgDbTimeout" data-path="db.connect_timeout" placeholder="Empty = default (10.0)">
                    <div class="lock-slot" data-lock-for="db.connect_timeout"></div>
                </div>
            </div>
        </div>

        <div class="actions-bar">
            <div id="saveStatus" class="status-msg"></div>
            <button type="submit" class="btn">Save &amp; Apply Settings</button>
        </div>
    </form>

    <script>
        let currentSources = {};

        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function setFieldValue(id, value, isOptionalZero, isLocked) {
            const el = document.getElementById(id);
            if (!el) return;
            if (el.type === 'checkbox') {
                el.checked = Boolean(value);
                return;
            }
            if (!isLocked && isOptionalZero && (value === 0 || value === 0.0 || value === null || value === undefined || value === '')) {
                el.value = '';
                return;
            }
            if (value === null || value === undefined) {
                el.value = '';
            } else {
                el.value = String(value);
            }
        }

        function applyLockStates(sources) {
            currentSources = sources || {};
            document.querySelectorAll('[data-path]').forEach(el => {
                const path = el.getAttribute('data-path');
                const meta = currentSources[path];
                const slot = document.querySelector(`[data-lock-for="${path}"]`);
                if (meta && meta.locked) {
                    el.disabled = true;
                    if (slot) {
                        const detail = meta.detail || `Set via ${meta.source}`;
                        slot.innerHTML = `<div class="lock-warn">&#9888; Locked &mdash; ${escapeHtml(detail)} (higher precedence than config.yaml)</div>`;
                    }
                } else {
                    el.disabled = false;
                    if (slot) {
                        slot.innerHTML = '';
                    }
                }
            });
        }

        async function loadSettingsState() {
            try {
                const res = await fetch('/admin/settings/state');
                const data = await res.json();
                const cfg = data.config || {};
                const sources = data.sources || {};
                const rt = data.runtime_info || {};

                const title = cfg.admin?.title || 'NVIDIA NIM Rate Limiter Dashboard';
                document.title = `${title} — Settings`;
                document.getElementById('headerTitle').innerText = title;

                document.getElementById('rtApiKeySource').innerText = rt.nvidia_api_key_source || 'unset';
                document.getElementById('rtDbBackend').innerText = rt.db_backend || '-';
                document.getElementById('rtDbTarget').innerText = rt.db_target || '-';
                document.getElementById('rtBind').innerText = `${rt.host || '127.0.0.1'}:${rt.port || 8000}`;

                const isLocked = (p) => Boolean(sources[p] && sources[p].locked);

                // Admin
                setFieldValue('cfgTitle', title, false, isLocked('admin.title'));

                // Rate limiting
                const rl = cfg.rate_limit || {};
                setFieldValue('cfgRpm', rl.requests_per_minute ?? 6, false, isLocked('rate_limit.requests_per_minute'));
                setFieldValue('cfgWindow', rl.window_seconds ?? 60, false, isLocked('rate_limit.window_seconds'));
                setFieldValue('cfgBurst', rl.burst_capacity ?? 6, false, isLocked('rate_limit.burst_capacity'));
                setFieldValue('cfgTpm', rl.tokens_per_minute ?? 0, true, isLocked('rate_limit.tokens_per_minute'));
                setFieldValue('cfgMaxWait', rl.max_wait_seconds ?? 0, true, isLocked('rate_limit.max_wait_seconds'));
                setFieldValue('cfgDailyReq', rl.daily_request_cap ?? 0, true, isLocked('rate_limit.daily_request_cap'));
                setFieldValue('cfgDailyTok', rl.daily_token_cap ?? 0, true, isLocked('rate_limit.daily_token_cap'));
                const modelsObj = rl.models || {};
                setFieldValue(
                    'cfgModelLimits',
                    Object.keys(modelsObj).length > 0 ? JSON.stringify(modelsObj, null, 2) : '',
                    false,
                    isLocked('rate_limit.models')
                );

                // Proxy & governance
                const proxy = cfg.proxy || {};
                setFieldValue('cfgUpstream', proxy.upstream_url ?? '', false, isLocked('proxy.upstream_url'));
                setFieldValue('cfgConcurrency', proxy.concurrency_limit ?? 1, false, isLocked('proxy.concurrency_limit'));
                setFieldValue('cfgDeploymentMode', proxy.deployment_mode ?? 'auto', false, isLocked('proxy.deployment_mode'));
                setFieldValue('cfgCatalogTtl', proxy.catalog_cache_ttl ?? 300, false, isLocked('proxy.catalog_cache_ttl'));
                setFieldValue('cfgEnforceCatalog', Boolean(proxy.enforce_catalog), false, isLocked('proxy.enforce_catalog'));
                setFieldValue('cfgAllowedModels', (proxy.allowed_models || []).join('\n'), false, isLocked('proxy.allowed_models'));
                setFieldValue('cfgBlockedModels', (proxy.blocked_models || []).join('\n'), false, isLocked('proxy.blocked_models'));
                const routesObj = proxy.model_routes || {};
                setFieldValue(
                    'cfgModelRoutes',
                    Object.keys(routesObj).length > 0 ? JSON.stringify(routesObj, null, 2) : '',
                    false,
                    isLocked('proxy.model_routes')
                );

                // Database
                const db = cfg.db || {};
                setFieldValue('cfgDbPath', db.path ?? 'limiter.db', false, isLocked('db.path'));
                setFieldValue('cfgDbUrlEnv', db.url_env ?? '', false, isLocked('db.url_env'));
                setFieldValue('cfgDbPoolMin', db.pool_min ?? 1, false, isLocked('db.pool_min'));
                setFieldValue('cfgDbPoolMax', db.pool_max ?? 5, false, isLocked('db.pool_max'));
                setFieldValue('cfgDbTimeout', db.connect_timeout ?? 10.0, false, isLocked('db.connect_timeout'));

                applyLockStates(sources);
            } catch (err) {
                console.error('Error loading settings state:', err);
                const msg = document.getElementById('saveStatus');
                msg.className = 'status-msg status-err';
                msg.innerText = 'Failed to load settings state from server.';
            }
        }

        function assignIfUnlocked(payload, section, key, value) {
            const path = `${section}.${key}`;
            if (currentSources[path] && currentSources[path].locked) {
                return;
            }
            if (!payload[section]) payload[section] = {};
            payload[section][key] = value;
        }

        async function saveSettings(e) {
            e.preventDefault();
            const statusEl = document.getElementById('saveStatus');
            statusEl.className = 'status-msg';
            statusEl.innerText = 'Saving...';

            const payload = {};
            try {
                assignIfUnlocked(payload, 'admin', 'title', document.getElementById('cfgTitle').value);

                assignIfUnlocked(payload, 'rate_limit', 'requests_per_minute', parseFloat(document.getElementById('cfgRpm').value));
                assignIfUnlocked(payload, 'rate_limit', 'window_seconds', parseFloat(document.getElementById('cfgWindow').value));
                assignIfUnlocked(payload, 'rate_limit', 'burst_capacity', parseFloat(document.getElementById('cfgBurst').value));
                assignIfUnlocked(payload, 'rate_limit', 'tokens_per_minute', document.getElementById('cfgTpm').value);
                assignIfUnlocked(payload, 'rate_limit', 'max_wait_seconds', document.getElementById('cfgMaxWait').value);
                assignIfUnlocked(payload, 'rate_limit', 'daily_request_cap', document.getElementById('cfgDailyReq').value);
                assignIfUnlocked(payload, 'rate_limit', 'daily_token_cap', document.getElementById('cfgDailyTok').value);
                const rawModelLimits = document.getElementById('cfgModelLimits').value.trim();
                assignIfUnlocked(payload, 'rate_limit', 'models', rawModelLimits ? JSON.parse(rawModelLimits) : {});

                assignIfUnlocked(payload, 'proxy', 'upstream_url', document.getElementById('cfgUpstream').value);
                assignIfUnlocked(payload, 'proxy', 'concurrency_limit', parseInt(document.getElementById('cfgConcurrency').value, 10));
                assignIfUnlocked(payload, 'proxy', 'deployment_mode', document.getElementById('cfgDeploymentMode').value);
                assignIfUnlocked(payload, 'proxy', 'catalog_cache_ttl', document.getElementById('cfgCatalogTtl').value);
                assignIfUnlocked(payload, 'proxy', 'enforce_catalog', document.getElementById('cfgEnforceCatalog').checked);
                assignIfUnlocked(payload, 'proxy', 'allowed_models', document.getElementById('cfgAllowedModels').value);
                assignIfUnlocked(payload, 'proxy', 'blocked_models', document.getElementById('cfgBlockedModels').value);
                const rawRoutes = document.getElementById('cfgModelRoutes').value.trim();
                assignIfUnlocked(payload, 'proxy', 'model_routes', rawRoutes ? JSON.parse(rawRoutes) : {});

                assignIfUnlocked(payload, 'db', 'path', document.getElementById('cfgDbPath').value);
                assignIfUnlocked(payload, 'db', 'url_env', document.getElementById('cfgDbUrlEnv').value);
                assignIfUnlocked(payload, 'db', 'pool_min', document.getElementById('cfgDbPoolMin').value);
                assignIfUnlocked(payload, 'db', 'pool_max', document.getElementById('cfgDbPoolMax').value);
                assignIfUnlocked(payload, 'db', 'connect_timeout', document.getElementById('cfgDbTimeout').value);
            } catch (parseErr) {
                statusEl.className = 'status-msg status-err';
                statusEl.innerText = `Invalid JSON input: ${parseErr.message}`;
                return;
            }

            try {
                const res = await fetch('/admin/config', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const body = await res.json();
                if (res.ok) {
                    if (body.ignored_locked_fields && body.ignored_locked_fields.length > 0) {
                        statusEl.className = 'status-msg status-warn';
                        statusEl.innerText = `Saved editable settings. Ignored locked overrides: ${body.ignored_locked_fields.join(', ')}`;
                    } else {
                        statusEl.className = 'status-msg status-ok';
                        statusEl.innerText = 'Settings saved and applied!';
                    }
                    await loadSettingsState();
                } else {
                    statusEl.className = 'status-msg status-err';
                    statusEl.innerText = body.detail || 'Error updating configuration.';
                }
            } catch (err) {
                console.error('Error saving settings:', err);
                statusEl.className = 'status-msg status-err';
                statusEl.innerText = 'Failed to connect to server.';
            }
        }

        loadSettingsState();
    </script>
</body>
</html>
